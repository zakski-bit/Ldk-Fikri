<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <style>
      .bold { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; }
      .semi { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; }
      .reg { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="520" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

  <!-- Top Red Banner -->
  <path d="M 0 24 Q 0 0 24 0 L 376 0 Q 400 0 400 24 L 400 68 L 0 68 Z" fill="#E11D48" />

  <!-- QRIS Logo Text -->
  <text x="32" y="44" fill="#FFFFFF" class="bold" font-size="28" letter-spacing="1.5">QRIS</text>
  <text x="32" y="58" fill="#FFE4E6" class="semi" font-size="9" letter-spacing="0.5">QR Code Indonesian Standard</text>

  <!-- GPN Logo Area -->
  <rect x="315" y="16" width="54" height="34" rx="6" fill="#FFFFFF" />
  <circle cx="332" cy="33" r="8" fill="#DC2626" />
  <circle cx="344" cy="33" r="8" fill="#2563EB" opacity="0.85" />
  <text x="355" y="36" fill="#0F172A" class="bold" font-size="8">GPN</text>

  <!-- Merchant Info -->
  <g transform="translate(200, 100)" text-anchor="middle">
    <text y="0" fill="#0F172A" class="bold" font-size="16" letter-spacing="0.5">MASJID DARUL ILMI PNJ</text>
    <text y="18" fill="#047857" class="semi" font-size="12">LDK FIKRI POLITEKNIK NEGERI JAKARTA</text>
    <text y="34" fill="#64748B" class="reg" font-size="11">NMID : ID102026090123456</text>
  </g>

  <!-- QR Code Container -->
  <rect x="75" y="150" width="250" height="250" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
  
  <!-- Realistic QR Code Matrix Pattern -->
  <g transform="translate(95, 170)">
    <!-- Top-Left Finder Square -->
    <rect x="0" y="0" width="56" height="56" fill="#0F172A" rx="4" />
    <rect x="8" y="8" width="40" height="40" fill="#F8FAFC" rx="2" />
    <rect x="16" y="16" width="24" height="24" fill="#0F172A" rx="2" />

    <!-- Top-Right Finder Square -->
    <rect x="154" y="0" width="56" height="56" fill="#0F172A" rx="4" />
    <rect x="162" y="8" width="40" height="40" fill="#F8FAFC" rx="2" />
    <rect x="170" y="16" width="24" height="24" fill="#0F172A" rx="2" />

    <!-- Bottom-Left Finder Square -->
    <rect x="0" y="154" width="56" height="56" fill="#0F172A" rx="4" />
    <rect x="8" y="162" width="40" height="40" fill="#F8FAFC" rx="2" />
    <rect x="16" y="170" width="24" height="24" fill="#0F172A" rx="2" />

    <!-- Timing Patterns -->
    <rect x="64" y="24" width="8" height="8" fill="#0F172A" />
    <rect x="80" y="24" width="8" height="8" fill="#0F172A" />
    <rect x="96" y="24" width="8" height="8" fill="#0F172A" />
    <rect x="112" y="24" width="8" height="8" fill="#0F172A" />
    <rect x="128" y="24" width="8" height="8" fill="#0F172A" />
    <rect x="144" y="24" width="8" height="8" fill="#0F172A" />

    <rect x="24" y="64" width="8" height="8" fill="#0F172A" />
    <rect x="24" y="80" width="8" height="8" fill="#0F172A" />
    <rect x="24" y="96" width="8" height="8" fill="#0F172A" />
    <rect x="24" y="112" width="8" height="8" fill="#0F172A" />
    <rect x="24" y="128" width="8" height="8" fill="#0F172A" />
    <rect x="24" y="144" width="8" height="8" fill="#0F172A" />

    <!-- Data Blocks -->
    <rect x="64" y="44" width="16" height="16" fill="#0F172A" />
    <rect x="88" y="44" width="24" height="12" fill="#0F172A" />
    <rect x="120" y="44" width="24" height="20" fill="#0F172A" />
    
    <rect x="44" y="64" width="16" height="24" fill="#0F172A" />
    <rect x="68" y="68" width="20" height="20" fill="#0F172A" />
    <rect x="96" y="64" width="32" height="16" fill="#0F172A" />
    <rect x="136" y="72" width="16" height="24" fill="#0F172A" />
    <rect x="160" y="64" width="24" height="16" fill="#0F172A" />
    <rect x="192" y="68" width="16" height="24" fill="#0F172A" />

    <!-- Center Alignment & Dots -->
    <rect x="96" y="96" width="20" height="20" fill="#0F172A" />
    <rect x="64" y="104" width="24" height="16" fill="#0F172A" />
    <rect x="124" y="100" width="28" height="16" fill="#0F172A" />
    <rect x="160" y="96" width="20" height="20" fill="#0F172A" />
    <rect x="188" y="100" width="20" height="16" fill="#0F172A" />

    <rect x="44" y="128" width="20" height="16" fill="#0F172A" />
    <rect x="72" y="124" width="24" height="24" fill="#0F172A" />
    <rect x="104" y="128" width="16" height="16" fill="#0F172A" />
    <rect x="128" y="124" width="20" height="28" fill="#0F172A" />
    <rect x="156" y="124" width="32" height="16" fill="#0F172A" />
    <rect x="196" y="128" width="12" height="24" fill="#0F172A" />

    <rect x="64" y="156" width="16" height="24" fill="#0F172A" />
    <rect x="88" y="160" width="24" height="16" fill="#0F172A" />
    <rect x="120" y="168" width="20" height="20" fill="#0F172A" />
    <rect x="148" y="156" width="24" height="28" fill="#0F172A" />
    <rect x="180" y="160" width="28" height="16" fill="#0F172A" />

    <rect x="64" y="188" width="28" height="20" fill="#0F172A" />
    <rect x="100" y="192" width="16" height="16" fill="#0F172A" />
    <rect x="124" y="188" width="28" height="20" fill="#0F172A" />
    <rect x="160" y="192" width="24" height="16" fill="#0F172A" />
    <rect x="192" y="188" width="16" height="20" fill="#0F172A" />

    <!-- Center Icon Badge -->
    <rect x="86" y="86" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="105" cy="105" r="14" fill="#047857" />
    <path d="M 99 108 L 105 100 L 111 108 Z" fill="#FBBF24" />
  </g>

  <!-- Dummy Notice Badge -->
  <rect x="105" y="408" width="190" height="22" rx="11" fill="#FEF3C7" stroke="#FDE68A" />
  <text x="200" y="423" text-anchor="middle" fill="#92400E" class="bold" font-size="10">CONTOH DUMMY RESMI QRIS</text>

  <!-- Bottom Apps Support Banner -->
  <g transform="translate(200, 455)" text-anchor="middle">
    <text y="0" fill="#64748B" class="semi" font-size="10">MENDUKUNG SEMUA APLIKASI PEMBAYARAN</text>
    <text y="16" fill="#0F172A" class="bold" font-size="11" letter-spacing="1">GoPay • OVO • Dana • ShopeePay • BSI • Mandiri • BCA</text>
  </g>

  <!-- Footer Bank Issuer -->
  <rect x="0" y="488" width="400" height="32" rx="0" fill="#F1F5F9" />
  <text x="200" y="508" text-anchor="middle" fill="#64748B" class="reg" font-size="9">
    DICETAK OLEH: BANK SYARIAH INDONESIA (BSI) / PT BANK MANDIRI (PERSERO) TBK
  </text>
</svg>
